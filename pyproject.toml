[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banff-visit-planner"
version = "2.0.0"
description = "Automated multi-model daily traffic forecasting, conformal uncertainty, exogenous climate/macro integration, and modern tourist planner for Banff, Alberta."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "statsforecast>=1.7",
    "mlforecast>=0.13",
    "utilsforecast>=0.2",
    "holidays>=0.50",
    "pantab>=5.2",
    "requests>=2.32",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.44",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
banff-planner = "banff_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

name: Update Traffic Data & Forecast

on:
  schedule:
    # Daily run at 11:00 UTC (04:00 AM MST / 05:00 AM MDT) so >= 15 future days stay live
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "daily-forecast-update"
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pipeline and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"

      - name: Refresh live data, run expanding CV, conformal calibration & rebuild site
        run: banff-planner --refresh-web

      - name: Verify mathematical, conformal & UI invariants before committing
        run: pytest -v

      - name: Commit and push updated data, forecasts, and static site
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "TW Traffic _data.csv" predictions.csv data/ outputs/ site/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily Banff traffic, exogenous data & conformal forecast update" && git push)
